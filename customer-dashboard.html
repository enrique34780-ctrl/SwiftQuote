<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Dashboard — SwiftQuote</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .dashboard-nav { display: flex; gap: 1rem; border-bottom: 1px solid #ddd; padding: 1rem 0; margin-bottom: 2rem; }
    .dashboard-nav button { padding: 0.75rem 1.5rem; border: none; background: none; cursor: pointer; font-size: 1rem; color: #666; }
    .dashboard-nav button.active { color: #0066cc; border-bottom: 3px solid #0066cc; }
    .tab { display: none; }
    .tab.active { display: block; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .card-title { font-size: 1.25rem; font-weight: bold; }
    .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.875rem; font-weight: 500; }
    .badge.scheduled { background: #e3f2fd; color: #1976d2; }
    .badge.in_progress { background: #fff3e0; color: #f57c00; }
    .badge.completed { background: #e8f5e9; color: #388e3c; }
    .badge.canceled { background: #ffebee; color: #c62828; }
    .request-form { display: grid; gap: 1rem; }
    .form-group { display: grid; gap: 0.5rem; }
    .form-group label { font-weight: 500; }
    .form-group input, .form-group select, .form-group textarea { padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; }
    .form-group textarea { resize: vertical; min-height: 120px; }
    .quote-item { background: #f9f9f9; padding: 1rem; border-radius: 4px; margin-bottom: 1rem; border-left: 4px solid #0066cc; }
    .quote-meta { display: flex; justify-content: space-between; font-size: 0.875rem; color: #666; margin-top: 0.5rem; }
    .job-timeline { position: relative; padding: 1rem 0 1rem 2rem; }
    .job-timeline::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: #ddd; }
    .timeline-event { position: relative; padding: 0.5rem 0; }
    .timeline-event::before { content: ''; position: absolute; left: -10px; top: 6px; width: 10px; height: 10px; background: #0066cc; border-radius: 50%; }
    .timeline-event-time { font-size: 0.875rem; color: #666; }
    .messaging { display: flex; flex-direction: column; height: 400px; border: 1px solid #ddd; border-radius: 4px; }
    .message-list { flex: 1; overflow-y: auto; padding: 1rem; background: #f9f9f9; }
    .message { margin-bottom: 1rem; padding: 0.75rem; border-radius: 4px; word-break: break-word; }
    .message.from-me { background: #e3f2fd; margin-left: 2rem; text-align: right; }
    .message.from-provider { background: #fff; margin-right: 2rem; border: 1px solid #ddd; }
    .message-input { padding: 1rem; border-top: 1px solid #ddd; display: flex; gap: 0.5rem; }
    .message-input input { flex: 1; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; }
    .review-form { display: grid; gap: 1rem; background: #f9f9f9; padding: 1.5rem; border-radius: 4px; }
    .rating-input { display: flex; gap: 0.5rem; }
    .star { font-size: 2rem; cursor: pointer; color: #ddd; }
    .star.active { color: #ffc107; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: #666; }
    .empty-state svg { width: 64px; height: 64px; margin-bottom: 1rem; opacity: 0.3; }
    .action-buttons { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .btn-small { padding: 0.5rem 1rem; font-size: 0.875rem; border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; }
    .btn-small.primary { background: #0066cc; color: #fff; border-color: #0066cc; }
    .btn-small.danger { background: #c62828; color: #fff; border-color: #c62828; }
    @media (max-width: 768px) {
      .dashboard-nav { flex-wrap: wrap; }
      .quote-meta { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header style="margin-bottom: 2rem;">
      <h1>Customer Dashboard</h1>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div id="accountInfo">Loading...</div>
        <button id="logoutBtn" class="primary">Log Out</button>
      </div>
    </header>

    <div class="dashboard-nav">
      <button class="tab-btn active" data-tab="requests">Service Requests</button>
      <button class="tab-btn" data-tab="quotes">Quotes</button>
      <button class="tab-btn" data-tab="jobs">Active Jobs</button>
      <button class="tab-btn" data-tab="reviews">Reviews</button>
      <button class="tab-btn" data-tab="history">History</button>
    </div>

    <!-- SERVICE REQUESTS TAB -->
    <div id="requests" class="tab active">
      <div class="card">
        <div class="card-title">Create New Service Request</div>
        <form id="requestForm" class="request-form">
          <div class="form-group">
            <label for="service">Service Type *</label>
            <select id="service" required>
              <option value="">Select a service...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="industry">Industry *</label>
            <select id="industry" required>
              <option value="">Select an industry...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="details">Project Details *</label>
            <textarea id="details" placeholder="Describe what you need help with..." required></textarea>
          </div>
          <div class="form-group">
            <label for="address">Address *</label>
            <input type="text" id="address" placeholder="Street address" required>
          </div>
          <div class="form-group">
            <label for="zip">ZIP Code *</label>
            <input type="text" id="zip" placeholder="12345" maxlength="10" required>
          </div>
          <div class="form-group">
            <label for="jobSize">Project Size</label>
            <select id="jobSize">
              <option value="small">Small</option>
              <option value="medium" selected>Medium</option>
              <option value="large">Large</option>
            </select>
          </div>
          <div class="form-group">
            <label for="timing">Needed By</label>
            <select id="timing">
              <option value="asap">As soon as possible</option>
              <option value="week">Within a week</option>
              <option value="month">Within a month</option>
              <option value="flexible">Flexible</option>
            </select>
          </div>
          <button type="submit" class="primary" style="padding: 0.75rem 1.5rem;">Post Request</button>
          <div id="requestMsg" class="error" aria-live="polite"></div>
        </form>
      </div>

      <div class="card">
        <div class="card-title">Your Recent Requests</div>
        <div id="requestsList"></div>
      </div>
    </div>

    <!-- QUOTES TAB -->
    <div id="quotes" class="tab">
      <div id="quotesList"></div>
    </div>

    <!-- ACTIVE JOBS TAB -->
    <div id="jobs" class="tab">
      <div id="jobsList"></div>
    </div>

    <!-- REVIEWS TAB -->
    <div id="reviews" class="tab">
      <div id="reviewsList"></div>
    </div>

    <!-- HISTORY TAB -->
    <div id="history" class="tab">
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    const esc = v => String(v ?? '').replace(/[&<>'"]/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[c]));

    let csrf = sessionStorage.getItem('sq_csrf') || '';
    let currentAccount = null;

    async function api(url, opts = {}) {
      const o = { ...opts, headers: { ...(opts.headers || {}), 'x-csrf-token': csrf } };
      if (o.body && typeof o.body !== 'string') {
        o.headers['content-type'] = 'application/json';
        o.body = JSON.stringify(o.body);
      }
      const r = await fetch(url, o);
      if (!r.ok) throw new Error((await r.json()).error || 'Request failed');
      const d = await r.json();
      if (d.csrf) { csrf = d.csrf; sessionStorage.setItem('sq_csrf', csrf); }
      return d;
    }

    async function loadAccount() {
      try {
        const d = await api('/api/account/me');
        if (d.account.type !== 'customer') throw new Error('Not a customer account');
        currentAccount = d.account;
        document.getElementById('accountInfo').textContent = `Welcome, ${esc(d.account.name)}`;
      } catch (e) {
        window.location.href = '/';
      }
    }

    async function loadServices() {
      try {
        const d = await api('/api/marketplace/services');
        const sel = document.getElementById('service');
        sel.innerHTML = '<option value="">Select a service...</option>' +
          d.services.map(x => `<option value="${esc(x.id)}">${esc(x.label)}</option>`).join('');
        const ind = document.getElementById('industry');
        ind.innerHTML = '<option value="">Select an industry...</option>' +
          Object.entries(d.industries).map(([k, v]) => `<option value="${esc(k)}">${esc(v)}</option>`).join('');
      } catch (e) { console.error(e); }
    }

    async function loadRequests() {
      try {
        const d = await api('/api/customer/marketplace-requests');
        const out = document.getElementById('requestsList');
        if (!d.requests?.length) {
          out.innerHTML = '<div class="empty-state"><p>No service requests yet.</p></div>';
          return;
        }
        out.innerHTML = d.requests.map(r => `
          <div class="card">
            <div class="card-header">
              <div>
                <div><b>${esc(r.service)}</b> in ${esc(r.industry)}</div>
                <div style="font-size: 0.875rem; color: #666;">${esc(r.address)} ${esc(r.zip_code)}</div>
              </div>
              <div class="badge">${esc(r.status || 'open')}</div>
            </div>
            <div>${esc(r.details)}</div>
            <div style="font-size: 0.875rem; color: #666; margin-top: 0.5rem;">
              Created ${new Date(r.created_at).toLocaleDateString()} • ${r.quote_count || 0} quotes
            </div>
            <button class="btn-small primary" onclick="viewRequestQuotes(${r.id})">View Quotes</button>
          </div>
        `).join('');
      } catch (e) { console.error(e); }
    }

    async function loadQuotes() {
      try {
        const d = await api('/api/customer/quotes');
        const out = document.getElementById('quotesList');
        if (!d.quotes?.length) {
          out.innerHTML = '<div class="card empty-state"><p>No quotes yet. Create a request to get started.</p></div>';
          return;
        }
        out.innerHTML = d.quotes.map(q => `
          <div class="card">
            <div class="card-header">
              <div>
                <div><b>${esc(q.provider_name)}</b></div>
                <div style="font-size: 0.875rem; color: #666;">Quote #${q.id} • ${esc(q.service)}</div>
              </div>
              <div>
                <div style="font-size: 1.5rem; font-weight: bold;">$${(q.amount / 100).toFixed(2)}</div>
                <div class="badge" style="background: ${q.status === 'accepted' ? '#e8f5e9' : '#f5f5f5'}; color: ${q.status === 'accepted' ? '#388e3c' : '#666'};">
                  ${esc(q.status)}
                </div>
              </div>
            </div>
            <div><b>Scope:</b> ${esc(q.scope)}</div>
            <div style="font-size: 0.875rem; color: #666; margin-top: 0.5rem;">
              Sent ${new Date(q.created_at).toLocaleDateString()}
            </div>
            ${q.status === 'sent' ? `
              <div class="action-buttons">
                <button class="btn-small primary" onclick="acceptQuote(${q.id})">Accept</button>
                <button class="btn-small" onclick="declineQuote(${q.id})">Decline</button>
              </div>
            ` : ''}
          </div>
        `).join('');
      } catch (e) { console.error(e); }
    }

    async function loadJobs() {
      try {
        const d = await api('/api/customer/jobs');
        const out = document.getElementById('jobsList');
        if (!d.jobs?.length) {
          out.innerHTML = '<div class="card empty-state"><p>No active jobs.</p></div>';
          return;
        }
        out.innerHTML = d.jobs.map(j => `
          <div class="card">
            <div class="card-header">
              <div>
                <div><b>${esc(j.provider_name)}</b></div>
                <div style="font-size: 0.875rem; color: #666;">Job #${j.id}</div>
              </div>
              <div class="badge ${j.status}">${esc(j.status)}</div>
            </div>
            <div style="margin: 1rem 0;">
              <b>Scheduled:</b> ${new Date(j.scheduled_date).toLocaleDateString()}
            </div>
            <div class="job-timeline">
              ${(j.timeline || []).map(e => `
                <div class="timeline-event">
                  <div style="font-weight: 500;">${esc(e.status)}</div>
                  <div class="timeline-event-time">${new Date(e.created_at).toLocaleString()}</div>
                </div>
              `).join('')}
            </div>
            <button class="btn-small primary" onclick="openJobChat(${j.id})">Message Provider</button>
            ${j.status === 'completed' && !j.review_id ? `
              <button class="btn-small" onclick="openReview(${j.id})">Leave Review</button>
            ` : ''}
          </div>
        `).join('');
      } catch (e) { console.error(e); }
    }

    async function acceptQuote(quoteId) {
      try {
        await api(`/api/quotes/${quoteId}/accept`, { method: 'POST' });
        alert('Quote accepted! Job booked.');
        loadQuotes();
        loadJobs();
      } catch (e) { alert('Error: ' + e.message); }
    }

    async function declineQuote(quoteId) {
      try {
        await api(`/api/quotes/${quoteId}/decline`, { method: 'POST' });
        alert('Quote declined.');
        loadQuotes();
      } catch (e) { alert('Error: ' + e.message); }
    }

    function openJobChat(jobId) {
      alert('Job messaging feature: open messaging UI for job ' + jobId);
    }

    function openReview(jobId) {
      alert('Review feature: open review form for job ' + jobId);
    }

    function viewRequestQuotes(requestId) {
      alert('View quotes for request ' + requestId);
    }

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'quotes') loadQuotes();
        if (btn.dataset.tab === 'jobs') loadJobs();
      });
    });

    // Request form
    document.getElementById('requestForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      const msg = document.getElementById('requestMsg');
      btn.disabled = true;
      msg.textContent = '';
      try {
        const d = await api('/api/marketplace/requests', {
          method: 'POST',
          body: {
            service: document.getElementById('service').value,
            industry: document.getElementById('industry').value,
            details: document.getElementById('details').value,
            address: document.getElementById('address').value,
            zip_code: document.getElementById('zip').value,
            job_size: document.getElementById('jobSize').value,
            timing: document.getElementById('timing').value,
          }
        });
        msg.textContent = 'Request posted! Providers will start sending quotes.';
        msg.style.color = 'green';
        e.target.reset();
        loadRequests();
      } catch (e) {
        msg.textContent = e.message;
        msg.style.color = 'red';
      } finally {
        btn.disabled = false;
      }
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
        await api('/api/account/logout', { method: 'POST' });
        window.location.href = '/';
      } catch (e) { alert('Logout failed'); }
    });

    // Initialize
    (async () => {
      await loadAccount();
      await loadServices();
      await loadRequests();
    })();
  </script>
</body>
</html>
